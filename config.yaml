# Order of episodes in your lesson
episodes:
- introduction.md
- safety-and-security.md
- recon.md
- specification.md
- verification-and-review.md
- documentation.md
- trust.md
- cost-context-energy.md
- research-and-outlook.md

# Information for Learners
learners:
- setup.md
- reference.md

# Information for Instructors
instructors:
- instructor-notes.md

# Learner Profiles
profiles:
- learner-profiles.md

